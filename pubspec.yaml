name: education_live_app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  supabase_flutter: ^2.5.6
  get_it: ^8.0.2
  dartz: ^0.10.1
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  image_picker: ^1.1.2
  intl: ^0.20.0
  flutter_svg: ^1.1.6
  connectivity_plus: ^6.0.5
  fluttertoast: ^9.0.0
  flutter_dotenv: ^6.0.0
  flutter_animate: ^4.5.2
  animate_do: ^4.2.0
  flutter_spinkit: ^5.2.2
  skeletonizer: ^2.1.3
  liquid_glass_bottom_bar: ^0.0.6
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/Button/
    - assets/icons/Card/
    - assets/icons/Form Elements/
    - assets/icons/Icon/
    - .env.dev
    - .env.prod

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/arabic/cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/arabic/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/cairo/Cairo-Regular.ttf
          weight: 400

    - family: Poppins
      fonts:
        - asset: assets/fonts/english/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/english/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/english/poppins/Poppins-Regular.ttf
          weight: 400